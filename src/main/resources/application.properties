# Application Configuration
spring.application.name=ecommerce-app
server.port=8080

# H2 Database Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:ecommercedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=ecommerce-app-secret-key-for-jwt-signing-make-it-long-and-random-in-production
app.jwt.expiration=86400000

# Logging Configuration
logging.level.root=INFO
logging.level.com.ecommerce.app=DEBUG
